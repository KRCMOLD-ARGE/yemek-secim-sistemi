<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yemek Seçim Sistemi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f6f9;color:#172033}.hide{display:none!important}button,input,select{font:inherit}h1,h2,h3{margin-top:0}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061427,#173c63)}.card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 18px 60px #0003}.login .card{width:min(440px,92vw)}.field{margin:12px 0}.field input,.field select,.row input,.row select{padding:11px 12px;border:1px solid #ccd5e0;border-radius:9px;background:#fff}.field input,.field select{width:100%}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.blue{background:#2869dc;color:#fff}.red{background:#df2734;color:#fff}.ghost{background:#fff;border:1px solid #d2dae5;color:#27364a}.top{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e3e8ef;position:sticky;top:0;z-index:5}.main{padding:18px;max-width:1320px;margin:auto}.person{background:#061427;color:#eef5ff;min-height:calc(100vh - 64px)}.topline,.between,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.topline,.between{justify-content:space-between}.notice{background:#063d32;border:1px solid #0b664f;color:#d8fff0;padding:12px 14px;border-radius:9px;margin:12px 0}.datebar{background:#102846;border:1px solid #1d3c5e;border-radius:9px;padding:13px 15px;margin:12px 0}.group{background:#0d2139;border:1px solid #1d3c5e;border-radius:12px;padding:13px;margin:14px 0}.group h3{display:flex;gap:9px;align-items:center;margin-bottom:12px}.badge{font-size:13px;padding:5px 9px;border-radius:6px;color:#fff}.g1{background:#2b70dd}.g2{background:#22a04b}.g3{background:#ff7600}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.meal{background:#102943;border:1px solid #2b4766;border-radius:9px;overflow:hidden;cursor:pointer;user-select:none}.meal.sel{outline:2px solid #2d78ff}.group[data-g="2"] .meal.sel{outline-color:#23b65d}.group[data-g="3"] .meal.sel{outline-color:#ff7600}.meal img,.ph{width:100%;height:132px;object-fit:cover;background:#203c59;display:grid;place-items:center;font-size:34px}.cap{padding:10px;display:flex;align-items:center;gap:6px}.radio{width:16px;height:16px;border:2px solid #d7e4f1;border-radius:50%;flex:0 0 auto}.meal.sel .radio{border:5px solid #2d78ff}.group[data-g="2"] .meal.sel .radio{border-color:#23b65d}.group[data-g="3"] .meal.sel .radio{border-color:#ff7600}.savebar{max-width:520px;margin:16px auto 26px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid #e0e5ec;border-radius:10px;overflow:hidden;margin-bottom:14px}.tab{background:#fff;border:0;border-right:1px solid #e7ebf0;border-radius:0}.tab.on{color:#4e31d3;border-bottom:3px solid #4e31d3}.panel{background:#fff;border:1px solid #dde4ed;border-radius:12px;padding:15px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid #e1e6ed;border-radius:10px;padding:13px}.stat b{display:block;font-size:20px;margin-top:4px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}.mmini{display:flex;align-items:center;gap:7px}.mmini img{width:34px;height:34px;border-radius:7px;object-fit:cover}.msg{padding:10px;border-radius:9px;margin:10px 0}.ok{background:#e7f7ee;color:#12673d}.err{background:#fde9eb;color:#a31f2c}.adminmeal{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}.am{border:1px solid #dde4ec;border-radius:11px;padding:10px}.am img,.am .ph{height:125px;border-radius:8px;width:100%;object-fit:cover}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sum{border:1px solid #dce4ed;border-radius:10px;overflow:hidden}.sum h3{padding:11px;margin:0;background:#f6f9fd}.sum ul{list-style:none;padding:7px 10px;margin:0}.sum li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #edf1f5}.modalbg{position:fixed;inset:0;background:#07111dcc;display:grid;place-items:center;padding:18px;z-index:9999}.modal{width:min(430px,94vw);background:#fff;color:#172033;border-radius:18px;padding:28px;text-align:center;box-shadow:0 24px 80px #0007}.modal .icon{width:76px;height:76px;border-radius:50%;background:#e7f8ef;color:#15904f;display:grid;place-items:center;font-size:42px;margin:0 auto 16px}.modal h2{font-size:24px;margin-bottom:8px}.modal p{color:#617083;line-height:1.45}.modal .btn{width:100%;margin-top:12px;padding:13px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.stats,.summary{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.stats,.summary{grid-template-columns:1fr}.main{padding:11px}.meal img,.ph{height:105px}.tabs{grid-template-columns:1fr 1fr}table{display:block;overflow:auto}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><h1>🍽️ Yemek Seçim Sistemi</h1><div id="lm"></div><div class="field"><input id="lu" placeholder="Kullanıcı adı"></div><div class="field"><input id="lp" type="password" placeholder="Parola"></div><button class="btn blue" style="width:100%" onclick="doLogin()">Giriş Yap</button></div></div>
<div id="app" class="hide"><div class="top"><b>🍽️ YEMEK SEÇİM SİSTEMİ</b><div><b id="who"></b> <button class="btn red" onclick="logout()">Çıkış</button></div></div>
<div id="person" class="person hide"><div class="main"><div class="topline"><div><h2 style="margin-bottom:3px">Günün yemeğini seçin</h2><span>Her gruptan bir yemek seçebilirsiniz.</span></div><button class="btn ghost" onclick="ownPass()">Parolamı Değiştir</button></div><div id="pm"></div><div id="datebar" class="datebar"></div><div id="groups"></div><div class="savebar"><button id="saveBtn" class="btn blue" style="width:100%" onclick="saveSel()">💾 Seçimi Kaydet / Güncelle</button></div></div></div>
<div id="admin" class="hide"><div class="main"><h2 style="color:#3e29b8">🛡️ ADMIN PANELİ</h2><div class="tabs"><button class="btn tab on" onclick="tab('ov',this)">Genel Bakış</button><button class="btn tab" onclick="tab('people',this)">Personeller</button><button class="btn tab" onclick="tab('meals',this)">Yemekler</button><button class="btn tab" onclick="tab('settings',this)">Admin Ayarları</button></div><div id="am"></div><section id="ov"></section><section id="people" class="hide"></section><section id="meals" class="hide"></section><section id="settings" class="hide"></section></div></div></div>
<div id="successModal" class="modalbg hide"><div class="modal"><div class="icon">✓</div><h2>İşleminiz kaydedildi</h2><p>Yemek seçiminiz başarıyla kaydedildi.<br><b>Afiyet olsun! 🍽️</b></p><button class="btn blue" onclick="closeSuccess()">Tamam</button></div></div>
<script>
const API='https://uviroysnefifverluald.supabase.co/functions/v1/yemek-api',KEY='sb_publishable_b4DEwbUk-VKN__5_Gry19g_vTvt0cFx';let token=localStorage.yemek_token||'',S={},P={1:null,2:null,3:null},saving=false;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(id,t,e=false){$(id).innerHTML=`<div class="msg ${e?'err':'ok'}">${esc(t)}</div>`}async function api(action,p={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','apikey':KEY,'x-session-token':token},body:JSON.stringify({action,...p})});let d=await r.json().catch(()=>({error:'Sunucu yanıtı alınamadı'}));if(!r.ok)throw Error(d.error||'İşlem başarısız');return d}
async function doLogin(){try{let d=await api('login',{username:lu.value,password:lp.value});token=d.token;localStorage.yemek_token=token;await boot()}catch(e){message('lm',e.message,true)}}async function logout(){try{await api('logout')}catch{}localStorage.removeItem('yemek_token');location.reload()}
async function boot(){try{S=await api('bootstrap');$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=S.user.full_name;if(S.user.role==='admin'){$('admin').classList.remove('hide');$('person').classList.add('hide');renderAdmin()}else{$('person').classList.remove('hide');$('admin').classList.add('hide');P={1:S.ownSelection?.group1_meal_id||null,2:S.ownSelection?.group2_meal_id||null,3:S.ownSelection?.group3_meal_id||null};renderPerson()}}catch(e){localStorage.removeItem('yemek_token');token='';$('login').classList.remove('hide');message('lm',e.message,true)}}
function img(m){return m?.image_url?`<img loading="lazy" src="${esc(m.image_url)}" alt="${esc(m.name)}" onerror="this.outerHTML='<div class=&quot;ph&quot;>🍽️</div>'">`:'<div class="ph">🍽️</div>'}function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function renderPerson(){if(S.ownSelection)$('pm').innerHTML='<div class="notice">✅ Daha önce yaptığınız seçim kayıtlı. İsterseniz değiştirip tekrar kaydedebilirsiniz.</div>';$('datebar').innerHTML='📅 <b>Tarih:</b> '+fmtDate(S.today);let L={1:'Ana Yemek',2:'Yan Yemek',3:'Yoğurt / Tatlı / Meyve'};$('groups').innerHTML=[1,2,3].map(g=>`<div class="group" data-g="${g}"><h3><span class="badge g${g}">${g}. GRUP</span><span>${L[g]}</span></h3><div class="grid">${S.meals.filter(m=>m.group_no===g).map(m=>`<div class="meal ${P[g]===m.id?'sel':''}" onclick="pick(${g},'${m.id}')">${img(m)}<div class="cap"><span class="radio"></span><b>${esc(m.name)}</b></div></div>`).join('')}</div></div>`).join('')}function pick(g,id){P[g]=id;renderPerson()}
function showSuccess(){$('successModal').classList.remove('hide')}function closeSuccess(){$('successModal').classList.add('hide')}
async function saveSel(){if(saving)return;if(!P[1]||!P[2]||!P[3])return message('pm','Lütfen 1., 2. ve 3. gruptan birer yemek seçin.',true);const b=$('saveBtn');saving=true;b.disabled=true;b.textContent='⏳ Kaydediliyor...';try{const d=await api('save_selection',{group1_meal_id:P[1],group2_meal_id:P[2],group3_meal_id:P[3]});if(!d?.ok)throw Error('Kayıt doğrulanamadı.');S.ownSelection=d.selection;b.textContent='✓ Seçim Kaydedildi';showSuccess();setTimeout(()=>{b.textContent='💾 Seçimi Güncelle';b.disabled=false;saving=false},700)}catch(e){message('pm','Kayıt sırasında hata: '+e.message,true);b.textContent='💾 Tekrar Dene';b.disabled=false;saving=false}}
async function ownPass(){let p=prompt('Yeni parola (en az 4 karakter):');if(!p)return;try{await api('change_own_password',{password:p});alert('Parola değiştirildi.')}catch(e){alert(e.message)}}function tab(id,b){['ov','people','meals','settings'].forEach(x=>$(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on')}function meal(id){return S.meals.find(m=>m.id===id)}function mini(id){let m=meal(id);return m?`<div class="mmini">${m.image_url?`<img src="${esc(m.image_url)}">`:''}<span>${esc(m.name)}</span></div>`:''}
function summaryBox(g,today){let counts={};today.forEach(s=>{let id=s['group'+g+'_meal_id'];if(id)counts[id]=(counts[id]||0)+1});return `<div class="sum"><h3>${g}. GRUP</h3><ul>${S.meals.filter(m=>m.group_no===g).map(m=>`<li><span>${mini(m.id)}</span><b>${counts[m.id]||0} kişi</b></li>`).join('')}</ul></div>`}
function renderAdmin(){let ppl=S.users.filter(u=>u.role==='personel'),today=S.todaySelections||[],done=today.length;$('ov').innerHTML=`<div class="stats"><div class="stat">Toplam Personel<b>${ppl.length}</b></div><div class="stat">Seçim Yapan<b>${done}</b></div><div class="stat">Seçim Yapmayan<b>${Math.max(0,ppl.length-done)}</b></div><div class="stat">Bugünün Tarihi<b style="font-size:15px">${esc(S.today)}</b></div></div><div class="panel"><div class="between"><h2>Personel Seçim Durumu</h2><button class="btn ghost" onclick="boot()">↻ Yenile</button></div><table><tr><th>İsim</th><th>Durum</th><th>1. Grup</th><th>2. Grup</th><th>3. Grup</th></tr>${ppl.map(u=>{let s=today.find(x=>x.user_id===u.id);return `<tr><td>${esc(u.full_name)}</td><td>${s?'✅ Seçti':'— Seçmedi'}</td><td>${s?mini(s.group1_meal_id):''}</td><td>${s?mini(s.group2_meal_id):''}</td><td>${s?mini(s.group3_meal_id):''}</td></tr>`}).join('')}</table></div><div class="panel"><h2>Bugünkü Seçim Özeti</h2><div class="summary">${[1,2,3].map(g=>summaryBox(g,today)).join('')}</div></div>`;$('people').innerHTML=`<div class="panel"><h2>Personel Ekle</h2><div class="row"><input id="nn" placeholder="Ad soyad"><input id="nu" placeholder="Kullanıcı adı"><input id="np" value="1234"><button class="btn blue" onclick="addUser()">Ekle</button></div></div><div class="panel"><table>${ppl.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td><button class="btn ghost" onclick="editUser('${u.id}')">Düzenle</button> <button class="btn red" onclick="delUser('${u.id}','${esc(u.full_name)}')">Sil</button></td></tr>`).join('')}</table></div>`;$('meals').innerHTML=`<div class="panel"><h2>Yemek Ekle</h2><div class="row"><input id="mn" placeholder="Yemek adı"><select id="mg"><option value="1">1. Grup</option><option value="2">2. Grup</option><option value="3">3. Grup</option></select><button class="btn blue" onclick="addMeal()">Ekle</button></div></div><div class="panel"><div class="adminmeal">${S.meals.map(m=>`<div class="am">${img(m)}<h3>${esc(m.name)}</h3><small>${m.group_no}. Grup</small><div class="row"><label class="btn ghost">📷 Fotoğraf<input hidden type="file" accept="image/*" onchange="upload('${m.id}',this)"></label><button class="btn ghost" onclick="editMeal('${m.id}')">Düzenle</button><button class="btn red" onclick="delMeal('${m.id}','${esc(m.name)}')">Sil</button></div></div>`).join('')}</div></div>`;let a=S.users.find(u=>u.role==='admin')||S.user;$('settings').innerHTML=`<div class="panel" style="max-width:520px"><h2>Admin Ayarları</h2><div class="field"><input id="an" value="${esc(a.full_name)}"></div><div class="field"><input id="au" value="${esc(a.username)}"></div><div class="field"><input id="ap" type="password" placeholder="Yeni parola"></div><button class="btn blue" onclick="saveAdmin('${a.id}')">Kaydet</button></div>`}
async function addUser(){try{await api('admin_add_user',{full_name:nn.value,username:nu.value,password:np.value});await boot()}catch(e){alert(e.message)}}async function editUser(id){let u=S.users.find(x=>x.id===id),n=prompt('Ad soyad:',u.full_name);if(n===null)return;let un=prompt('Kullanıcı adı:',u.username);if(un===null)return;let p=prompt('Yeni parola (boşsa değişmez):','');try{await api('admin_update_user',{id,full_name:n,username:un,password:p||undefined});await boot()}catch(e){alert(e.message)}}async function delUser(id,n){if(confirm(n+' silinsin mi?'))try{await api('admin_delete_user',{id});await boot()}catch(e){alert(e.message)}}async function addMeal(){try{await api('admin_add_meal',{name:mn.value,group_no:Number(mg.value)});await boot()}catch(e){alert(e.message)}}async function editMeal(id){let m=meal(id),n=prompt('Yemek adı:',m.name);if(n===null)return;let g=prompt('Grup:',m.group_no);if(g===null)return;try{await api('admin_update_meal',{id,name:n,group_no:Number(g)});await boot()}catch(e){alert(e.message)}}async function delMeal(id,n){if(confirm(n+' kaldırılsın mı?'))try{await api('admin_delete_meal',{id});await boot()}catch(e){alert(e.message)}}function b64(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}async function upload(id,i){let f=i.files?.[0];if(!f)return;try{await api('admin_upload_meal_image',{id,mime:f.type,base64:await b64(f)});await boot()}catch(e){alert(e.message)}}async function saveAdmin(id){try{await api('admin_update_user',{id,full_name:an.value,username:au.value,password:ap.value||undefined});await boot()}catch(e){alert(e.message)}}
lp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('successModal').addEventListener('click',e=>{if(e.target.id==='successModal')closeSuccess()});if(token)boot();
</script></body></html>
