<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yemek Seçim Sistemi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f6f9;color:#172033}.hide{display:none!important}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061427,#173c63)}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 18px 60px #0003}.login .card{width:min(430px,92vw)}h1,h2,h3{margin-top:0}.field{margin:12px 0}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd5e0;border-radius:10px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.blue{background:#2869dc;color:#fff}.red{background:#d92c39;color:#fff}.ghost{background:#fff;border:1px solid #ced8e4}.top{height:66px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e3e8ef;position:sticky;top:0;z-index:5}.main{padding:20px;max-width:1250px;margin:auto}.person{background:#061427;color:#eef5ff;min-height:calc(100vh - 66px)}.group{background:#0d2139;border:1px solid #1d3c5e;border-radius:14px;padding:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.meal{background:#102943;border:1px solid #2b4766;border-radius:12px;overflow:hidden;cursor:pointer}.meal.sel{outline:3px solid #2d78ff}.meal img,.ph{width:100%;height:120px;object-fit:cover;background:#203c59;display:grid;place-items:center;font-size:34px}.meal b{display:block;padding:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{background:#fff;border:1px solid #dce3ec}.tab.on{background:#5b42d6;color:#fff}.panel{background:#fff;border:1px solid #dde4ed;border-radius:14px;padding:16px;margin-bottom:15px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}.msg{padding:10px;border-radius:9px;margin:10px 0}.ok{background:#e7f7ee;color:#12673d}.err{background:#fde9eb;color:#a31f2c}.adminmeal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.am{border:1px solid #dde4ec;border-radius:12px;padding:10px}.am img,.am .ph{height:130px;border-radius:9px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px}.main{padding:12px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><h1>🍽️ Yemek Seçim Sistemi</h1><div id="lm"></div><div class="field"><input id="lu" placeholder="Kullanıcı adı"></div><div class="field"><input id="lp" type="password" placeholder="Parola"></div><button class="btn blue" style="width:100%" onclick="doLogin()">Giriş Yap</button></div></div>
<div id="app" class="hide"><div class="top"><b>🍽️ Yemek Seçim Sistemi</b><div><b id="who"></b> <button class="btn red" onclick="logout()">Çıkış</button></div></div><div id="person" class="person hide"><div class="main"><div class="between"><div><h2>Günün yemeğini seç</h2><span>Her gruptan bir seçim yapın.</span></div><button class="btn ghost" onclick="ownPass()">Parolamı Değiştir</button></div><div id="pm"></div><div id="groups"></div><button class="btn blue" style="width:100%;margin:12px 0 30px" onclick="saveSel()">Seçimi Kaydet / Güncelle</button></div></div><div id="admin" class="hide"><div class="main"><div class="tabs"><button class="btn tab on" onclick="tab('ov',this)">Genel Bakış</button><button class="btn tab" onclick="tab('people',this)">Personeller</button><button class="btn tab" onclick="tab('meals',this)">Yemekler</button><button class="btn tab" onclick="tab('settings',this)">Admin Ayarları</button></div><div id="am"></div><section id="ov"></section><section id="people" class="hide"></section><section id="meals" class="hide"></section><section id="settings" class="hide"></section></div></div></div>
<script>
const API='https://uviroysnefifverluald.supabase.co/functions/v1/yemek-api',KEY='sb_publishable_b4DEwbUk-VKN__5_Gry19g_vTvt0cFx';
let token=localStorage.yemek_token||'',S={},P={1:null,2:null,3:null};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(id,t,e=false){$(id).innerHTML=`<div class="msg ${e?'err':'ok'}">${esc(t)}</div>`}
async function api(action,p={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','apikey':KEY,'x-session-token':token},body:JSON.stringify({action,...p})});let d=await r.json().catch(()=>({error:'Sunucu yanıtı alınamadı'}));if(!r.ok)throw Error(d.error||'İşlem başarısız');return d}
async function doLogin(){try{let d=await api('login',{username:lu.value,password:lp.value});token=d.token;localStorage.yemek_token=token;await boot()}catch(e){message('lm',e.message,true)}}
async function logout(){try{await api('logout')}catch{}localStorage.removeItem('yemek_token');location.reload()}
async function boot(){try{S=await api('bootstrap');$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=S.user.full_name;if(S.user.role==='admin'){$('admin').classList.remove('hide');$('person').classList.add('hide');renderAdmin()}else{$('person').classList.remove('hide');$('admin').classList.add('hide');renderPerson()}}catch(e){localStorage.removeItem('yemek_token');token='';$('login').classList.remove('hide');message('lm',e.message,true)}}
function img(m){return m.image_url?`<img src="${esc(m.image_url)}" onerror="this.outerHTML='<div class=&quot;ph&quot;>🍽️</div>'">`:'<div class="ph">🍽️</div>'}
function renderPerson(){P={1:S.ownSelection?.group1_meal_id||null,2:S.ownSelection?.group2_meal_id||null,3:S.ownSelection?.group3_meal_id||null};if(S.ownSelection)message('pm','Seçiminiz kayıtlı. Gün içinde değiştirebilirsiniz.');let L={1:'Ana Yemek',2:'Yan Yemek',3:'Yoğurt / Tatlı / Meyve'};$('groups').innerHTML=[1,2,3].map(g=>`<div class="group"><h3>${g}. Grup — ${L[g]}</h3><div class="grid">${S.meals.filter(m=>m.group_no===g).map(m=>`<div class="meal ${P[g]===m.id?'sel':''}" onclick="pick(${g},'${m.id}')">${img(m)}<b>${esc(m.name)}</b></div>`).join('')}</div></div>`).join('')}
function pick(g,id){P[g]=id;renderPerson()}
async function saveSel(){if(!P[1]||!P[2]||!P[3])return message('pm','Her gruptan bir yemek seçmelisiniz.',true);try{await api('save_selection',{group1_meal_id:P[1],group2_meal_id:P[2],group3_meal_id:P[3]});message('pm','Seçiminiz kaydedildi.');await boot()}catch(e){message('pm',e.message,true)}}
async function ownPass(){let p=prompt('Yeni parola (en az 4 karakter):');if(!p)return;try{await api('change_own_password',{password:p});alert('Parola değiştirildi.')}catch(e){alert(e.message)}}
function tab(id,b){['ov','people','meals','settings'].forEach(x=>$(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function mealName(id){return S.meals.find(m=>m.id===id)?.name||''}
function renderAdmin(){let ppl=S.users.filter(u=>u.role==='personel'),today=S.todaySelections||[];$('ov').innerHTML=`<div class="panel between"><h2>Bugün: ${esc(S.today)}</h2><button class="btn ghost" onclick="boot()">↻ Yenile</button></div><div class="panel"><h2>Personel Durumu</h2><table><tr><th>İsim</th><th>Durum</th><th>1.Grup</th><th>2.Grup</th><th>3.Grup</th></tr>${ppl.map(u=>{let s=today.find(x=>x.user_id===u.id);return `<tr><td>${esc(u.full_name)}</td><td>${s?'✓ Seçti':'— Seçmedi'}</td><td>${s?esc(mealName(s.group1_meal_id)):''}</td><td>${s?esc(mealName(s.group2_meal_id)):''}</td><td>${s?esc(mealName(s.group3_meal_id)):''}</td></tr>`}).join('')}</table></div>`;
$('people').innerHTML=`<div class="panel"><h2>Personel Ekle</h2><div class="row"><input id="nn" placeholder="Ad soyad"><input id="nu" placeholder="Kullanıcı adı"><input id="np" value="1234" placeholder="Parola"><button class="btn blue" onclick="addUser()">Ekle</button></div></div><div class="panel"><table><tr><th>İsim</th><th>Kullanıcı</th><th>İşlem</th></tr>${ppl.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td><button class="btn ghost" onclick="editUser('${u.id}')">Düzenle</button> <button class="btn red" onclick="delUser('${u.id}','${esc(u.full_name)}')">Sil</button></td></tr>`).join('')}</table></div>`;
$('meals').innerHTML=`<div class="panel"><h2>Yemek Ekle</h2><div class="row"><input id="mn" placeholder="Yemek adı"><select id="mg"><option value="1">1. Grup</option><option value="2">2. Grup</option><option value="3">3. Grup</option></select><button class="btn blue" onclick="addMeal()">Ekle</button></div></div><div class="panel"><div class="adminmeal">${S.meals.map(m=>`<div class="am">${img(m)}<h3>${esc(m.name)}</h3><small>${m.group_no}. Grup</small><div class="row"><label class="btn ghost">📷 Fotoğraf<input hidden type="file" accept="image/jpeg,image/png,image/webp" onchange="upload('${m.id}',this)"></label><button class="btn ghost" onclick="editMeal('${m.id}')">Düzenle</button><button class="btn red" onclick="delMeal('${m.id}','${esc(m.name)}')">Sil</button></div></div>`).join('')}</div></div>`;
let a=S.users.find(u=>u.role==='admin')||S.user;$('settings').innerHTML=`<div class="panel" style="max-width:520px"><h2>Admin Ayarları</h2><div class="field"><input id="an" value="${esc(a.full_name)}" placeholder="Ad"></div><div class="field"><input id="au" value="${esc(a.username)}" placeholder="Kullanıcı adı"></div><div class="field"><input id="ap" type="password" placeholder="Yeni parola (boşsa değişmez)"></div><button class="btn blue" onclick="saveAdmin('${a.id}')">Kaydet</button></div>`}
async function addUser(){try{await api('admin_add_user',{full_name:nn.value,username:nu.value,password:np.value});await boot();tab('people',document.querySelectorAll('.tab')[1])}catch(e){message('am',e.message,true)}}
async function editUser(id){let u=S.users.find(x=>x.id===id),n=prompt('Ad soyad:',u.full_name);if(n===null)return;let un=prompt('Kullanıcı adı:',u.username);if(un===null)return;let p=prompt('Yeni parola (değişmeyecekse boş):','');try{await api('admin_update_user',{id,full_name:n,username:un,password:p||undefined});await boot();tab('people',document.querySelectorAll('.tab')[1])}catch(e){alert(e.message)}}
async function delUser(id,n){if(!confirm(n+' silinsin mi?'))return;try{await api('admin_delete_user',{id});await boot();tab('people',document.querySelectorAll('.tab')[1])}catch(e){alert(e.message)}}
async function addMeal(){try{await api('admin_add_meal',{name:mn.value,group_no:Number(mg.value)});await boot();tab('meals',document.querySelectorAll('.tab')[2])}catch(e){alert(e.message)}}
async function editMeal(id){let m=S.meals.find(x=>x.id===id),n=prompt('Yemek adı:',m.name);if(n===null)return;let g=prompt('Grup:',m.group_no);if(g===null)return;try{await api('admin_update_meal',{id,name:n,group_no:Number(g)});await boot();tab('meals',document.querySelectorAll('.tab')[2])}catch(e){alert(e.message)}}
async function delMeal(id,n){if(!confirm(n+' kaldırılsın mı?'))return;try{await api('admin_delete_meal',{id});await boot();tab('meals',document.querySelectorAll('.tab')[2])}catch(e){alert(e.message)}}
function b64(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function upload(id,i){let f=i.files?.[0];if(!f)return;if(f.size>5*1024*1024)return alert('En fazla 5 MB');try{await api('admin_upload_meal_image',{id,mime:f.type,base64:await b64(f)});await boot();tab('meals',document.querySelectorAll('.tab')[2])}catch(e){alert(e.message)}}
async function saveAdmin(id){try{await api('admin_update_user',{id,full_name:an.value,username:au.value,password:ap.value||undefined});await boot();tab('settings',document.querySelectorAll('.tab')[3])}catch(e){alert(e.message)}}
lp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});if(token)boot();
</script></body></html>
