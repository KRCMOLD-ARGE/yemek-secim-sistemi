<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yemek Seçim Sistemi</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061427}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="appFrame" src="app.html" title="Yemek Seçim Sistemi"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const s=d.createElement('style');
    s.textContent=`
      .person{position:relative!important;background:#061427!important;isolation:isolate;overflow:hidden;}
      .person::before{
        content:"";
        position:absolute;
        inset:0;
        pointer-events:none;
        z-index:0;
        background-image:url("kraw-wallpaper.png");
        background-repeat:repeat;
        background-position:20px 20px;
        background-size:290px 290px;
        opacity:.28;
        filter:brightness(.78) contrast(1.08);
      }
      .person::after{
        content:"";
        position:absolute;
        inset:0;
        pointer-events:none;
        z-index:0;
        background:rgba(6,20,39,.16);
      }
      .person .main{position:relative!important;z-index:1!important;}
      @media(max-width:900px){
        .person::before{background-size:230px 230px;opacity:.24;background-position:8px 8px;}
      }
    `;
    d.head.appendChild(s);
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
